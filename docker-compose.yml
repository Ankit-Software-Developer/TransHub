version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: transporter_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-Ankit@6980}
      MYSQL_DATABASE: ${DB_NAME:-transporter_saas_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: transporter_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transporter_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-transporter_saas_db}
      DB_USER: root
      DB_PASS: ${DB_PASS:-Ankit@6980}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-transporter_secret_jwt_access_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-transporter_secret_jwt_refresh_2026}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: transporter_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"

volumes:
  mysql_data:
